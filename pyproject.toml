[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgn-app"
version = "1.0"
description = "Wandle deutsche Schachnotation in PGN Format."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tkinterdnd2>=0.6.3",
    "requests",
    "pyperclip",
]

[project.scripts]
pgn-app = "pgn_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
