[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgn-app"
version = "0.1.0"
description = "A Python application for working with PGN chess files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pgn-app = "pgn_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
