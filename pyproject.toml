[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgn-app"
version = "0.5"
description = "A Python application for working with PGN chess files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tkinterdnd2>=0.6.3",
]

[project.scripts]
pgn-app = "pgn_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
